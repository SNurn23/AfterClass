<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: head"></head>
<body id="bodytable">
<header th:replace="fragments/header :: header"></header>
<main>
    <div class="container">
        <div class="row mt-5">
            <div class="col">
                <div th:if="${success}" th:text="${success}" class="alert alert-success" role="alert"></div>

                <div th:if="${studyGroups.isEmpty()}" class="alert alert-info alert-dismissible fade show" role="alert">
                    <h4>You must enter studyGroups.</h4>
                    <a th:href="@{/studyGroups/form}" class="alert-link">Create studyGroups.</a>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:unless="${studyGroups.isEmpty()}" class="table-responsive">

                    <div class="row">
                        <div class="d-flex justify-content-end">
                            <a th:href="@{/studyGroups/form}" class="btn btn-primary mb-2" >Add Group</a>
                        </div>
                    </div>

                    <table class="table table-hover table-bordered border-dark table-light">
                        <thead>
                        <tr class="table-dark">
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Limit People</th>
                            <th>Creation Date</th>
                            <th> </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="studyGroup : ${studyGroups}">
                            <td th:text="${studyGroup.name}"></td>
                            <td th:text="${studyGroup.subject.name}"></td>
                            <td th:text="${studyGroup.limit_people}"></td>
                            <td th:text="${studyGroup.creation_date}"></td>
                            <div th:if="${action == 'join'}">
                                <td>
                                    <form th:action="@{/studyGroups/join/__${studyGroup.id}__}" method="POST">
                                        <button type="submit" class="btn btn-primary">Join</button>
                                    </form>
                                </td>
                            </div>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
